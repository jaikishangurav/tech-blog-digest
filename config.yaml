# Email subject/links
archive_url: "https://jaikishangurav.github.io/tech-blog-digest/"
backfill_days: 14        # on first run, ignore posts older than this
max_new_per_run: 30      # caps API cost per run
model: gemini-3.5-flash-lite   # check free-tier models/limits in Google AI Studio
request_delay: 6         # seconds between LLM calls (free tier is rate limited per minute)

# What you want emailed. Gemini scores each article 1-5 against this;
# only articles scoring >= min_score are emailed (everything is still archived).
interests: >
  Software engineering, DevOps, AWS and cloud infrastructure, databases.
  In-depth write-ups on how real systems are designed, scaled, migrated, debugged
  and operated. Not product launches, feature announcements or customer case studies.
min_score: 4             # 5 = deep dives only, 3 = more volume

# Allowed tags + how often each is emailed: daily | weekly | off
# (the summarizer picks 1-3 of these per article; "off" tags are archived only)
tags:
  distributed-systems: daily
  databases: daily
  ml-infra: weekly
  ai-llm: daily
  security: "off"
  frontend-mobile: weekly
  devops-cloud: daily
  default: weekly        # fallback for the "general" tag

# Optional per feed: max_per_email caps how many of its articles go in one email
# (the highest-scoring are kept; the rest are archived only)
feeds:
  - {name: Netflix, url: "https://netflixtechblog.com/feed"}
  - {name: Uber, url: "https://www.uber.com/blog/engineering/rss/"}
  - {name: Meta, url: "https://engineering.fb.com/feed/"}
  - {name: AWS Architecture, url: "https://aws.amazon.com/blogs/architecture/feed/"}
  - {name: Cloudflare, url: "https://blog.cloudflare.com/rss/", max_per_email: 2}
  - {name: Airbnb, url: "https://medium.com/feed/airbnb-engineering"}
  - {name: Stripe, url: "https://stripe.com/blog/feed.rss"}
  - {name: GitHub, url: "https://github.blog/engineering/feed/"}
  - {name: Discord, url: "https://discord.com/blog/rss.xml"}
  - {name: Microsoft, url: "https://devblogs.microsoft.com/engineering-at-microsoft/feed/"}
  - {name: Google Developers, url: "https://developers.googleblog.com/feeds/posts/default"}
