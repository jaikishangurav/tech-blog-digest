<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Tech Blog Digest</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mu:#666;--bd:#e3e3e3;--ac:#1a56db}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--mu:#999;--bd:#333;--ac:#7aa7ff}}
body{font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg);max-width:760px;margin:0 auto;padding:16px}
input{width:100%;padding:10px;font:inherit;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);box-sizing:border-box}
.chips{margin:12px 0}.chip{display:inline-block;margin:0 6px 6px 0;padding:2px 10px;border:1px solid var(--bd);border-radius:99px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
h2{font-size:14px;color:var(--mu);margin:28px 0 8px}article{border-bottom:1px solid var(--bd);padding:12px 0}
a{color:var(--ac)}.meta{font-size:13px;color:var(--mu)}
</style></head><body><h1>Tech Blog Digest</h1>
<input id="q" placeholder="Search title, summary, company..."><div class="chips" id="chips"></div><div id="list"></div>
<script>
const D=[{"url": "https://blog.cloudflare.com/workers-on-demand-profiling/", "company": "Cloudflare", "title": "Introducing on-demand CPU and memory profiling\u00a0with flamegraphs for Workers and Durable Objects", "published": "2026-10-09T13:00:00+00:00", "summary": "Cloudflare has introduced on-demand CPU and memory profiling with interactive flamegraphs for Workers and Durable Objects in production. The feature allows developers to pinpoint resource-heavy functions, optimize performance, and debug memory issues using either the Cloudflare Dashboard or CLI.", "takeaways": ["On-demand CPU and memory profiles can be captured directly from production Workers and Durable Objects using the dashboard or CLI.", "Profiling helps identify specific performance bottlenecks, such as recursive JSON processing and redundant metric calls.", "Cloudflare handles distributed isolates and stateful Durable Objects to route profiling requests to the correct physical server without blocking execution."], "tags": ["devops-cloud", "distributed-systems"]}, {"url": "https://blog.cloudflare.com/deno-joins-cloudflare/", "company": "Cloudflare", "title": "Deno is joining Cloudflare", "published": "2026-10-09T12:50:00+00:00", "summary": "Cloudflare announces that the Deno team is joining forces with them to improve the self-hosting capabilities of the open-source Cloudflare Workers runtime (workerd). The collaboration will merge code and ideas from Deno's celld project back into workerd to build a scalable, self-hostable implementation of Durable Objects and the Workers programming model.", "takeaways": ["Deno's team is joining Cloudflare to help make workerd self-hosting a first-class experience.", "The partnership will merge code and concepts from Deno's celld project into workerd to solve the self-hosting limitations of Durable Objects.", "Cloudflare emphasizes its commitment to open source, noting that workerd is the exact same runtime used in production."], "tags": ["devops-cloud", "distributed-systems"]}, {"url": "https://blog.cloudflare.com/agentic-security-operations/", "company": "Cloudflare", "title": "Building an evidence-grounded agentic security operations harness on Cloudflare", "published": "2026-10-07T16:30:36+00:00", "summary": "Cloudflare has introduced an evidence-grounded multi-agent AI harness to manage security operations and combat alert fatigue. The architecture uses deterministic code for initial reconnaissance and scope enforcement before passing data to specialist AI agents and the open-source decision model Clef. This approach prevents hallucinations and scope drift by strictly separating evidence collection from model inference.", "takeaways": ["Deterministic application code gathers and versions all evidence before any AI inference begins to ensure reproducibility and prevent scope drift.", "A coordinator agent distributes tasks to four specialized parallel agents, whose typed findings are synthesized into a strict advisory format.", "The architecture relies on Cloudflare developer tools like Workers, Workflows, D1, and R2 to coordinate execution, validate citations, and maintain state."], "tags": ["ai-llm", "security", "devops-cloud"]}, {"url": "https://blog.cloudflare.com/root-ksk-2024-rollover/", "company": "Cloudflare", "title": "The keys to the Internet change\u00a0on October 11. Are you ready?", "published": "2026-10-06T17:50:11+00:00", "summary": "On October 11, the DNS root is scheduled to undergo its second-ever key-signing key (KSK) rollover, replacing KSK-2017 with the new RSA/SHA-256 key KSK-2024. Validating DNS resolvers must trust this new key beforehand to prevent healthy websites from becoming unreachable due to DNSSEC validation failures. Tools like the RFC 8509 trust anchor sentinel protocol allow operators and users to verify resolver readiness ahead of the switch.", "takeaways": ["The DNS root KSK rollover on October 11, 2026, replaces KSK-2017 with KSK-2024 (key tag 38696).", "Validating DNS resolvers must trust the new key in advance to avoid breaking DNSSEC validation and website availability.", "RFC 8509 root key trust anchor sentinels enable users and operators to query and verify resolver trust states safely."], "tags": ["security", "devops-cloud", "distributed-systems"]}, {"url": "https://medium.com/airbnb-engineering/beyond-synthetic-testing-capturing-and-replaying-real-database-workloads-at-airbnb-cea7ee9b1ab2?source=rss----53c7c27702d5---4", "company": "Airbnb", "title": "Beyond synthetic testing: Capturing and replaying real database workloads at Airbnb", "published": "2026-10-06T17:01:04+00:00", "summary": "Airbnb built a unified database traffic capture and replay system using ProxySQL, a Log Mover, a Log Processor, and a Log Replayer to test load, verify query compatibility across version upgrades, and debug performance issues offline. The system captures production SQL statements along with their transactional context without requiring application changes, encrypts all sensitive data, and allows replaying workloads at custom rates or against multiple targets for result comparison.", "takeaways": ["Leveraged ProxySQL as a single, client-agnostic capture point to log production queries without modifying applications.", "Built offline Log Processors to partition, order, and rewrite queries (such as pinning auto-increment IDs) to ensure consistent replay behavior.", "Supported both load testing (replay only) and compatibility testing (replay and compare) to safely plan capacity and de-risk database upgrades."], "tags": ["databases", "devops-cloud"]}, {"url": "https://engineering.fb.com/2026/10/06/production-engineering/nts-authenticated-time-at-meta/", "company": "Meta", "title": "NTS: Authenticated Time at Meta", "published": "2026-10-06T16:00:06+00:00", "summary": "Meta has rolled out public Network Time Security (NTS) at nts.meta.com to provide authenticated, verifiable time synchronization and protect against man-in-the-middle time manipulation attacks. The architecture utilizes stateless NTS servers that derive cookie keys via HKDF based on the epoch day, eliminating the need for replicated session tables or distributed key rings. By open-sourcing the implementation through Meta's Time library, the system allows clients to securely bootstrap multiple independent NTP sources from a single key exchange endpoint.", "takeaways": ["NTS adds cryptographic authentication to NTP using a two-phase process: TLS-based Key Exchange (NTS-KE) followed by authenticated NTP packets over UDP.", "Meta's servers remain completely stateless by dynamically deriving sealing keys using HKDF-SHA256 from a master secret and the epoch day.", "Using chrony's pool configuration enables clients to establish multiple independent authenticated NTP sources from a single KE endpoint."], "tags": ["security", "devops-cloud", "distributed-systems"]}, {"url": "https://aws.amazon.com/blogs/architecture/announcing-the-aws-digital-sovereignty-well-architected-lens/", "company": "AWS Architecture", "title": "Announcing the AWS Digital Sovereignty Lens for the Well-Architected Framework", "published": "2026-10-05T17:54:56+00:00", "summary": "AWS has launched the Digital Sovereignty Lens for the Well-Architected Framework, providing architectural guidance, questions, and best practices to help organizations build and operate sovereign workloads. The lens covers operational excellence, security, reliability, and performance efficiency pillars to address data locality, access control, continuity, portability, and transparency. It integrates with the AWS Well-Architected Tool to help cross-functional teams assess and manage sovereignty risks.", "takeaways": ["The lens uses five core questions to evaluate workload locality, access control, continuity, portability, and transparency.", "It covers 21 questions and 37 best practices across four pillars of the Well-Architected Framework.", "It is available as a custom lens in the AWS Well-Architected Tool and integrates with existing AWS policy controls."], "tags": ["security", "devops-cloud"]}, {"url": "https://blog.cloudflare.com/birthday-week-2026-wrap-up/", "company": "Cloudflare", "title": "Everything we launched during Birthday Week 2026", "published": "2026-10-05T13:00:00+00:00", "summary": "During Birthday Week 2026, Cloudflare announced 46 new product features and infrastructure updates spanning open-source tooling, post-quantum cryptography, agentic internet monetization, and developer platform expansions. Key highlights include new open-source CLIs and SDK generation pipelines, post-quantum certificate authority plans, HTTP 402-based monetization for AI agents, and serverless data platform releases like Cloudflare Basin.", "takeaways": ["Cloudflare expanded its developer and agent platforms with tools like the agentic CLI 'cf', Cloudflare Basin for serverless analytics, and K2 event streams.", "The company advanced its post-quantum cryptography roadmap by announcing plans for a public CA issuing Merkle Tree Certificates and adding ML-KEM/ML-DSA support.", "New economic models and infrastructure for the agentic Internet were introduced, featuring HTTP 402 Monetization Gateways and Pay Per Use billing for publishers."], "tags": ["security", "devops-cloud", "ai-llm"]}, {"url": "https://blog.cloudflare.com/one-observability-platform/", "company": "Cloudflare", "title": "8 major updates to Cloudflare Observability", "published": "2026-10-02T18:00:00+00:00", "summary": "Cloudflare has launched eight major updates to unify its observability platform, combining logs, traces, analytics, alerts, dashboards, and exports under a single system. The release introduces new features like Cloudflare Traces in open beta, a unified SQL API for human and AI agent queries, custom alerts, and expanded Logpush availability for all self-serve plans.", "takeaways": ["Unifies logs, traces, analytics, and security events into a single observability platform with a shared SQL API.", "Introduces Cloudflare Traces in open beta and brings Logpush with Transformers to all self-serve plans.", "Establishes a unified volume-based pricing model for ingested and stored logs and traces starting December 1, 2026."], "tags": ["devops-cloud", "security"]}, {"url": "https://aws.amazon.com/blogs/architecture/deploy-oracle-database-step-by-step-on-amazon-evs-with-fsx-for-ontap/", "company": "AWS Architecture", "title": "Deploy Oracle Database step by step on Amazon EVS with FSx for ONTAP", "published": "2026-10-02T17:57:15+00:00", "summary": "This article provides a step-by-step guide for deploying Oracle Database on Amazon Elastic VMware Service (Amazon EVS) using Amazon FSx for NetApp ONTAP as an NFS datastore. It covers provisioning, storage configuration, installing Oracle 19c, setting up SnapMirror for disaster recovery, and outlining migration paths and day-2 operations.", "takeaways": ["Amazon EVS combined with FSx for NetApp ONTAP allows enterprises to run Oracle databases on AWS while preserving existing VMware operational workflows.", "The deployment workflow spans provisioning VMs, setting up NFS datastores, configuring Oracle 19c, and implementing SnapMirror for cross-region disaster recovery.", "Four migration paths are available for moving on-premises Oracle workloads, including VMware HCX, SnapMirror, PDB relocation, and RMAN backup/restore."], "tags": ["databases", "devops-cloud"]}, {"url": "https://aws.amazon.com/blogs/architecture/architect-highly-available-oracle-database-on-amazon-evs-and-fsx-for-ontap/", "company": "AWS Architecture", "title": "Architect highly available Oracle Database on Amazon EVS and FSx for ONTAP", "published": "2026-10-02T17:57:01+00:00", "summary": "This article details how to architect a highly available Oracle Database environment on Amazon Elastic VMware Service (EVS) using Amazon FSx for NetApp ONTAP. It covers EC2 instance selection, hybrid network routing, vSAN and NFS storage design, and cross-region disaster recovery via SnapMirror.", "takeaways": ["Design Oracle database architectures on Amazon EVS using optimized EC2 bare metal instances like i7i.", "Split storage duties by using local vSAN for temporary/swap files and FSx for ONTAP via NFS datastores for persistent Oracle data and logs.", "Implement cross-region disaster recovery using NetApp SnapMirror while factoring in Oracle licensing compliance."], "tags": ["databases", "devops-cloud", "distributed-systems"]}, {"url": "https://aws.amazon.com/blogs/architecture/deploy-open-source-regional-availability-tools-in-your-vpc/", "company": "AWS Architecture", "title": "Deploy open source Regional availability tools in your VPC", "published": "2026-10-02T17:50:56+00:00", "summary": "The article introduces two open source solutions, Capability Insights for AWS and Workload Analysis, designed to deploy regional service availability data directly into an Amazon VPC. These tools allow organizations to securely track AWS service availability, compliance reporting, and multi-region expansion plans while filtering the massive service catalog down to the specific services actively used by their workloads.", "takeaways": ["Capability Insights for AWS deploys a self-hosted regional availability dashboard, API, and auto-refreshing mechanism inside your own VPC and S3 bucket.", "Workload Analysis uses AWS CloudTrail and CloudFormation stack inspection to narrow down over 200 AWS services to the specific 20-30 services actually utilized by your account.", "Both solutions operate within your network perimeter, ensuring that regional availability data and gap analyses remain secure, private, and tailored to your organization's infrastructure."], "tags": ["devops-cloud", "security", "distributed-systems"]}, {"url": "https://blog.cloudflare.com/streamline/", "company": "Cloudflare", "title": "Streamline: custom video pipelines with Cloudflare Stream and Workers", "published": "2026-10-02T16:13:45+00:00", "summary": "Cloudflare has introduced Streamline, a new developer playground and architecture that uses Workers, Containers, and Durable Objects to build custom video processing pipelines. The system allows developers to manipulate live and on-demand video in real-time\u2014such as adding overlays, burning subtitles, or applying filters\u2014and instantly publish the modified output.", "takeaways": ["Streamline combines Cloudflare Containers for real-time media processing, Durable Objects for orchestration, and Workers for control signaling.", "The Media Engine utilizes a Go-based controller harness and FFmpeg to handle complex input/output protocols like RTMPS, HLS, and WebSockets.", "The platform provides a high-level TypeScript API for managing long-running video sessions, configuring processing pipelines, and streaming custom outputs."], "tags": ["devops-cloud", "distributed-systems"]}, {"url": "https://blog.cloudflare.com/introducing-web-search-api/", "company": "Cloudflare", "title": "Introducing Web Search API via AI Gateway", "published": "2026-10-02T13:28:10+00:00", "summary": "Cloudflare has introduced a new Web Search API via AI Gateway, partnering with providers like Ceramic.ai, Exa, and Linkup to give AI agents access to live internet data. The API features strict bot-crawling standards, Zero Data Retention (ZDR) options, and seamless integration through direct REST endpoints or Cloudflare Workers bindings.", "takeaways": ["Integrates live web search capabilities directly into AI inference pipelines via AI Gateway.", "Launch partners commit to honest bot crawling standards, respecting robots.txt and providing content source links.", "Available via standard REST APIs and Cloudflare Workers bindings with support for Bring-Your-Own-Key (BYOK)."], "tags": ["ai-llm", "devops-cloud", "ml-infra"]}, {"url": "https://blog.cloudflare.com/cloudflare-tracing/", "company": "Cloudflare", "title": "Introducing Cloudflare Traces: follow requests through our entire platform", "published": "2026-10-02T13:00:00+00:00", "summary": "Cloudflare has introduced Cloudflare Traces in open beta, extending automatic tracing beyond Workers to cover security rules, transformations, caching, routing, and origin handling across the entire request path. The feature supports OpenTelemetry standards, W3C trace context propagation, customizable sampling rates, and OTLP export to external observability platforms.", "takeaways": ["Automatic request tracing captures platform operations like security rules and caching without requiring custom instrumentation.", "Supports end-to-end distributed tracing using W3C traceparent headers and OpenTelemetry (OTLP) exports.", "Enables precise debugging via Trace Rules and integration with the Cloudflare Observability MCP server for AI agents."], "tags": ["devops-cloud", "security"]}, {"url": "https://blog.cloudflare.com/account-abuse-protection-dashboard/", "company": "Cloudflare", "title": "Follow the thread: a new dashboard to investigate account abuse", "published": "2026-10-02T13:00:00+00:00", "summary": "Cloudflare has introduced a new fraud dashboard for its Account Abuse Protection (AAP) service, providing stateful account overviews to help security and fraud teams investigate login and signup abuse. The workspace utilizes privacy-preserving Hashed User IDs to track behavioral, network, and device patterns over time, enabling analysts to spot anomalies, filter suspicious cohorts, and trace individual account activity. Additionally, the release establishes granular access control roles to minimize unnecessary exposure of personally identifiable information (PII).", "takeaways": ["AAP shifts fraud prevention from stateless point-in-time identity checks to a stateful trust model tracking historical behavioral patterns.", "The new dashboard functions as an investigative funnel, moving from aggregate population metrics down to individual Hashed User IDs and specific event logs.", "Granular access control roles (Account Abuse Protection and Account Abuse Protection PII) ensure least-privilege access for dashboard users and data exports."], "tags": ["security", "devops-cloud"]}, {"url": "https://blog.cloudflare.com/protected-quick-tunnels/", "company": "Cloudflare", "title": "Protected Quick Tunnels: simple accountless authentication for your next dev project", "published": "2026-10-02T13:00:00+00:00", "summary": "Cloudflare has introduced Protected Quick Tunnels, allowing developers to add email-based authentication to their accountless local development tunnels using the --allowed-mail flag. The architecture separates identity verification (handled by Cloudflare Access and a stateless Workers-based broker) from authorization (evaluated locally on the developer's machine by cloudflared), ensuring the guest list remains entirely private.", "takeaways": ["Quick Tunnels now support email and domain authorization via the new --allowed-mail flag without requiring a Cloudflare account.", "Authentication is handled by Cloudflare Access and a stateless broker, while the authorization policy remains completely private and localized on the developer's machine.", "Coding agents and tools like Wrangler can easily incorporate protected tunnels into their default workflows to securely share local dev servers."], "tags": ["security", "devops-cloud"]}, {"url": "https://aws.amazon.com/blogs/architecture/accelerating-airline-retailing-innovation-how-datalex-modernized-with-aws-experience-based-acceleration-and-agentic-ai/", "company": "AWS Architecture", "title": "Accelerating airline retailing innovation: how Datalex modernized with AWS Experience-Based Acceleration and agentic AI", "published": "2026-10-01T15:37:06+00:00", "summary": "Datalex partnered with AWS in a three-day Experience-Based Acceleration (EBA) workshop to modernize its mission-critical airline retailing platform. Using AWS services, agentic AI tools, and a Strangler Fig pattern, the team successfully migrated legacy Java 8/EJB2 components to Spring Boot on Java 21 while maintaining continuous operations.", "takeaways": ["Migrated a legacy Java 8/EJB2 architecture to Spring Boot and Java 21 in three days using AWS Experience-Based Acceleration and agentic AI.", "Employed a business service proxy and the Strangler Fig pattern to enable incremental migration without disrupting airline operations.", "Integrated Amazon Bedrock and specialized agents to create a natural language interface for booking retrieval and workflow automation."], "tags": ["devops-cloud", "ai-llm", "security"]}, {"url": "https://blog.cloudflare.com/clef-decision-models/", "company": "Cloudflare", "title": "Introducing Clef: our open-source decision models, and new RL fine-tuning platform", "published": "2026-10-01T15:34:02+00:00", "summary": "Cloudflare has introduced Clef and Clef-flash, open-source decision models hosted on Workers AI that produce bounded structured outputs and probabilities for agentic workflows. Built using Qwen base models with a specialized non-autoregressive architecture, the models feature a 64k context window and a vision encoder. Additionally, Cloudflare announced a reinforcement learning fine-tuning platform designed to customize the models for specific enterprise use cases.", "takeaways": ["Clef models utilize a non-autoregressive, prefill-only architecture to derive schema choices directly, achieving lower latency than traditional LLMs.", "The models include a 64k context window, a vision encoder for visual content classification, and full Jev-API compatibility.", "Cloudflare is open-sourcing Clef on Hugging Face under an Apache 2.0 license alongside a new reinforcement learning fine-tuning product."], "tags": ["ai-llm", "ml-infra", "devops-cloud"]}, {"url": "https://aws.amazon.com/blogs/architecture/running-multi-day-az-evacuation-drills-with-arc-zonal-shift/", "company": "AWS Architecture", "title": "Running multi-day AZ evacuation drills with ARC Zonal Shift", "published": "2026-09-30T19:01:57+00:00", "summary": "This article details how to run multi-day Availability Zone (AZ) evacuation drills using AWS Application Recovery Controller (ARC) Zonal Shift. It covers step-by-step procedures for Amazon ECS, EKS, RDS, and Aurora to expose failure modes that brief disaster recovery tests miss.", "takeaways": ["Multi-day AZ evacuation drills uncover hidden time-dependent failure modes like stale DNS, unoptimized auto-scaling, and long-lived database connections.", "ARC Zonal Shift coordinates data plane actions across Route 53 and load balancers to safely isolate traffic without changing application code.", "Comprehensive drills require pre-scaling for N-1 capacity and adjusting configurations like deregistration delays and stop timeouts across compute tiers."], "tags": ["devops-cloud", "distributed-systems", "databases"]}, {"url": "https://aws.amazon.com/blogs/architecture/how-mhk-built-a-hipaa-eligible-agentic-ai-solution-on-amazon-bedrock/", "company": "AWS Architecture", "title": "How MHK built a HIPAA-eligible agentic AI solution on Amazon Bedrock", "published": "2026-09-30T18:30:24+00:00", "summary": "MHK built SmartProminence, a HIPAA-eligible agentic AI orchestrator on AWS using Amazon Bedrock, ECS Fargate, and Amazon SQS. The stateless, event-driven architecture employs a controller-agent pattern with DAG-based execution to process unstructured medical documents and automate healthcare workflows.", "takeaways": ["Separating workflow orchestration from LLM processing enables independent horizontal scaling and consistent compliance enforcement.", "Using Amazon SQS and an event-driven architecture allows asynchronous, fault-isolated task execution across complex medical workflows.", "A configuration-driven dynamic agent registry reduces new AI workflow deployment times from months to weeks."], "tags": ["ai-llm", "distributed-systems", "devops-cloud"]}, {"url": "https://aws.amazon.com/blogs/architecture/build-adaptive-ai-interfaces-with-the-ag-ui-protocol-agent-swarms-and-nova-act-on-aws/", "company": "AWS Architecture", "title": "Build adaptive AI interfaces with the AG-UI protocol, agent swarms, and Nova Act on AWS", "published": "2026-09-29T13:44:23+00:00", "summary": "This article explains how to build adaptive AI user interfaces on AWS using the AG-UI protocol, the Strands Agents SDK Swarm pattern, and Amazon Nova Act. It details an architecture that handles variable AI outputs, integrates with legacy systems, and maintains HIPAA compliance for processing medical data.", "takeaways": ["Use the AG-UI protocol and Server-Sent Events to stream dynamic UI updates and remove custom integration code.", "Implement the Strands Agents SDK Swarm pattern for multi-agent peer collaboration and consensus-driven analysis.", "Integrate legacy systems securely with browser-based automation via Amazon Nova Act while adhering to HIPAA compliance rules."], "tags": ["ai-llm", "security", "frontend-mobile"]}];let tag=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tags=[...new Set(D.flatMap(a=>a.tags))].sort();
function render(){
 const q=document.getElementById('q').value.toLowerCase();
 document.getElementById('chips').innerHTML=tags.map(t=>`<span class="chip${t==tag?' on':''}" data-t="${esc(t)}">${esc(t)}</span>`).join('');
 let day='',h='';
 for(const a of D){
  if(tag&&!a.tags.includes(tag))continue;
  if(q&&!(a.title+a.summary+a.company+a.takeaways.join(' ')).toLowerCase().includes(q))continue;
  const d=a.published.slice(0,10);
  if(d!==day){day=d;h+=`<h2>${esc(d)}</h2>`}
  h+=`<article><a href="${esc(a.url)}"><b>${esc(a.title)}</b></a><div class="meta">${esc(a.company)} · ${a.tags.map(esc).join(', ')}</div><p>${esc(a.summary)}</p><ul>${a.takeaways.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></article>`}
 document.getElementById('list').innerHTML=h||'<p>No matches.</p>'}
document.getElementById('q').oninput=render;
document.getElementById('chips').onclick=e=>{const t=e.target.dataset.t;if(t){tag=tag==t?null:t;render()}};
render();
</script></body></html>
